<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百年孤独 - CIEN AÑOS de soledad</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+SC:wght@200;400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Noto Serif SC', serif; overflow: hidden; }
    
    #canvas3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    
    /* 顶部 */
    .top-bar { 
      position: fixed; top: 0; left: 0; right: 0; height: 60px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 30px; z-index: 100; 
    }
    .logo { 
      font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 6px; 
      color: rgba(255,215,0,0.8); display: flex; flex-direction: column; line-height: 1.2;
    }
    .logo-sub { font-size: 11px; letter-spacing: 10px; color: rgba(255,255,255,0.25); font-weight: 300; }
    .controls { display: flex; gap: 12px; }
    .ctrl-btn { 
      cursor: pointer; font-size: 12px; padding: 6px 14px; 
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; color: rgba(255,255,255,0.5); transition: all 0.3s;
    }
    .ctrl-btn:hover { background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.3); color: #ffd700; }
    .ctrl-btn.active { background: rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.4); color: #ffd700; }
    
    /* 代际选择器 */
    .gen-selector { 
      position: fixed; top: 60px; left: 0; right: 0; height: 45px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      display: flex; align-items: center; justify-content: center; 
      gap: 8px; z-index: 100; 
    }
    .gen-btn { 
      padding: 5px 14px; background: transparent; 
      border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; 
      cursor: pointer; font-size: 11px; color: rgba(255,255,255,0.4);
      transition: all 0.3s; font-family: 'Noto Serif SC', serif;
    }
    .gen-btn:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.15); }
    .gen-btn.active { 
      background: rgba(255,215,0,0.1); border-color: rgba(255,215,0,0.3); 
      color: #ffd700; 
    }
    
    .hint { 
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
      font-size: 11px; color: rgba(255,255,255,0.2); z-index: 100;
      letter-spacing: 4px; font-family: 'Cinzel', serif;
    }
    
    .tooltip { 
      position: fixed; background: rgba(5,8,20,0.95); 
      border: 1px solid rgba(255,215,0,0.2); border-radius: 10px; 
      padding: 12px 18px; z-index: 200; pointer-events: none; 
      display: none; backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .tooltip-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .tooltip-gen { font-size: 10px; color: #ffd700; letter-spacing: 2px; }
    
    /* 星球名称标签 */
    .planet-label {
      position: fixed; padding: 6px 16px; border-radius: 20px;
      background: rgba(5,8,20,0.85); border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px; font-weight: 600; color: #fff; letter-spacing: 1px;
      pointer-events: none; z-index: 150;
      opacity: 0; transition: opacity 0.3s ease;
      transform: translate(-50%, -100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    .planet-label.show { opacity: 1; }
    .planet-label .label-gen { font-size: 9px; color: #ffd700; margin-left: 8px; }
    
    /* 信息面板 */
    .panel { 
      position: fixed; right: -520px; top: 0; bottom: 0; width: 500px; 
      background: rgba(5,8,20,0.97);
      border-left: 1px solid rgba(255,215,0,0.08); z-index: 300; 
      overflow-y: auto; transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(40px);
    }
    .panel.show { right: 0; }
    .panel-close { 
      position: absolute; top: 15px; right: 15px; width: 32px; height: 32px; 
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; z-index: 10; transition: all 0.3s; font-size: 14px; color: rgba(255,255,255,0.4);
    }
    .panel-close:hover { background: rgba(255,255,255,0.06); color: #fff; }
    
    .panel-header { 
      padding: 35px 28px 20px; 
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .panel-name { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
    .panel-name-en { font-size: 12px; color: rgba(255,255,255,0.3); font-style: italic; margin-top: 5px; }
    .panel-badge { 
      display: inline-block; padding: 4px 14px; 
      background: rgba(255,215,0,0.08);
      border: 1px solid rgba(255,215,0,0.2); border-radius: 16px; 
      font-size: 11px; margin-top: 10px; color: #ffd700;
    }
    
    .panel-section { padding: 18px 28px; }
    .section-title { 
      font-size: 11px; color: rgba(255,215,0,0.7); font-weight: 600; 
      margin-bottom: 14px; letter-spacing: 4px;
    }
    .info-row { margin-bottom: 12px; }
    .info-label { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 2px; }
    .info-value { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-top: 3px; }
    
    .story-card { 
      background: rgba(255,255,255,0.015); 
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    }
    .story-header { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .story-title { font-size: 14px; font-weight: 600; }
    .story-toggle { font-size: 11px; color: rgba(255,215,0,0.6); }
    .story-content { padding: 0 14px 14px; border-top: 1px solid rgba(255,255,255,0.04); display: none; }
    .story-content.show { display: block; }
    .story-desc { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.8; margin: 12px 0; }
    .story-original { 
      font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.8; 
      padding: 12px 14px; 
      background: rgba(255,215,0,0.02);
      border-left: 2px solid rgba(255,215,0,0.3); border-radius: 0 6px 6px 0;
    }
    
    .related-item { 
      padding: 12px 14px; display: flex; justify-content: space-between; 
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer;
      transition: all 0.3s;
    }
    .related-item:hover { background: rgba(255,255,255,0.02); }
    .related-name { font-size: 14px; }
    .related-relation { font-size: 10px; color: rgba(255,215,0,0.6); margin-top: 2px; }
    
    .term-card { 
      background: rgba(255,255,255,0.015); 
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    }
    .term-header { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .term-name { font-size: 14px; font-weight: 600; }
    .term-cat { font-size: 10px; color: rgba(255,255,255,0.3); }
    .term-content { padding: 0 14px 14px; border-top: 1px solid rgba(255,255,255,0.04); display: none; }
    .term-content.show { display: block; }
    .term-desc { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.8; margin: 12px 0; }
    .term-original { 
      font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.8; 
      padding: 12px 14px; 
      background: rgba(255,215,0,0.02);
      border-left: 2px solid rgba(255,215,0,0.3); border-radius: 0 6px 6px 0;
    }
    
    /* 启动页 */
    .splash { 
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: #000; 
      z-index: 1000; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    
    /* 启动页星空背景 */
    .splash-stars { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    
    .splash-content { position: relative; z-index: 10; text-align: center; }
    
    .splash-title { 
      font-family: 'Cinzel', serif;
      font-size: 64px; font-weight: 900;
      letter-spacing: 25px; margin-bottom: 10px; 
      background: linear-gradient(135deg, #ffd700 0%, #ffaa00 30%, #fff 50%, #ffd700 70%, #ffaa00 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 3s ease-in-out infinite;
    }
    
    .splash-sub-cn {
      font-size: 20px; letter-spacing: 15px; color: rgba(255,255,255,0.35);
      margin-bottom: 8px; font-weight: 200;
    }
    .splash-sub-en {
      font-family: 'Cinzel', serif; font-size: 14px; font-style: italic;
      letter-spacing: 8px; color: rgba(255,215,0,0.3); margin-bottom: 60px;
    }
    
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    
    .splash-desc { 
      font-size: 16px; color: rgba(255,255,255,0.4); 
      margin-bottom: 80px; letter-spacing: 5px; font-weight: 200;
    }
    
    .splash-btn { 
      padding: 18px 60px; 
      background: transparent;
      border: 1px solid rgba(255,215,0,0.3); color: #ffd700; 
      font-size: 13px; border-radius: 30px; cursor: pointer; 
      letter-spacing: 10px; transition: all 0.5s;
      font-family: 'Cinzel', serif; position: relative; overflow: hidden;
    }
    .splash-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.1), transparent);
      transition: left 0.5s;
    }
    .splash-btn:hover::before { left: 100%; }
    .splash-btn:hover { 
      border-color: rgba(255,215,0,0.6);
      box-shadow: 0 0 30px rgba(255,215,0,0.1);
    }
    
    /* 流星动画 */
    .meteor {
      position: absolute;
      width: 2px;
      height: 80px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
      animation: meteor-fall linear infinite;
      opacity: 0;
    }
    
    @keyframes meteor-fall {
      0% { transform: translateY(-100px) translateX(0) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh) translateX(-200px) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 启动页 -->
  <div class="splash" id="splash">
    <canvas id="splashCanvas" class="splash-stars"></canvas>
    <div class="splash-content">
      <div class="splash-title">CIEN AÑOS</div>
      <div class="splash-sub-cn">百年孤独</div>
      <div class="splash-sub-en">de soledad</div>
      <div class="splash-desc">布恩迪亚家族七代人的孤独宿命</div>
      <div class="splash-btn" onclick="enterGalaxy()">进 入 星 系</div>
    </div>
  </div>

  <canvas id="canvas3d"></canvas>
  
  <div class="top-bar">
    <div class="logo">CIEN AÑOS<div class="logo-sub">百年孤独 · de soledad</div></div>
    <div class="controls">
      <button class="ctrl-btn" id="musicBtn" onclick="toggleMusic()">🔇 静音</button>
      <button class="ctrl-btn" onclick="openEncyclopedia()">📖</button>
      <button class="ctrl-btn active" id="autoRotateBtn" onclick="toggleAutoRotate()">自动旋转</button>
    </div>
  </div>
  
  <div class="gen-selector" id="genSelector"></div>
  <div class="hint">DRAG · SCROLL · CLICK TO EXPLORE</div>
  <div class="tooltip" id="tooltip"><div class="tooltip-name" id="tooltipName"></div><div class="tooltip-gen" id="tooltipGen"></div></div>
  <div id="planetLabels"></div>
  <div class="panel" id="panel"><div class="panel-close" onclick="closePanel()">✕</div><div id="panelContent"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // ========== 启动页星空和流星 ==========
    (function() {
      const canvas = document.getElementById('splashCanvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      let meteors = [];
      
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
      }
      
      function initStars() {
        stars = [];
        for (let i = 0; i < 500; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            opacity: Math.random() * 0.8 + 0.2,
            twinkleSpeed: Math.random() * 0.02 + 0.005
          });
        }
      }
      
      function createMeteor() {
        if (meteors.length < 3 && Math.random() < 0.02) {
          meteors.push({
            x: Math.random() * canvas.width,
            y: -100,
            speed: 8 + Math.random() * 12,
            length: 80 + Math.random() * 120,
            opacity: 0.6 + Math.random() * 0.4,
            angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3
          });
        }
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 背景渐变
        const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width * 0.8);
        gradient.addColorStop(0, '#0a0e27');
        gradient.addColorStop(0.5, '#050810');
        gradient.addColorStop(1, '#000005');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 星星
        stars.forEach(star => {
          star.opacity += (Math.random() - 0.5) * 0.05;
          star.opacity = Math.max(0.1, Math.min(1, star.opacity));
          
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
          ctx.fill();
        });
        
        // 流星
        createMeteor();
        meteors = meteors.filter(m => {
          m.x += Math.cos(m.angle) * m.speed;
          m.y += Math.sin(m.angle) * m.speed;
          m.opacity -= 0.005;
          
          if (m.opacity <= 0 || m.y > canvas.height) return false;
          
          // 绘制流星
          const gradient = ctx.createLinearGradient(
            m.x, m.y,
            m.x - Math.cos(m.angle) * m.length,
            m.y - Math.sin(m.angle) * m.length
          );
          gradient.addColorStop(0, `rgba(255, 255, 255, ${m.opacity})`);
          gradient.addColorStop(0.3, `rgba(200, 220, 255, ${m.opacity * 0.6})`);
          gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(
            m.x - Math.cos(m.angle) * m.length,
            m.y - Math.sin(m.angle) * m.length
          );
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 2;
          ctx.stroke();
          
          // 流星头部光点
          ctx.beginPath();
          ctx.arc(m.x, m.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${m.opacity})`;
          ctx.fill();
          
          return true;
        });
        
        requestAnimationFrame(animate);
      }
      
      window.addEventListener('resize', resize);
      resize();
      animate();
    })();

    // ========== 背景音乐 - 自动播放静音模式 ==========
    let bgmAudio = null;
    let isMuted = false;

    function initMusic() {
      bgmAudio = new Audio();
      bgmAudio.loop = true;
      bgmAudio.volume = 0.5;
      bgmAudio.preload = 'auto';
      bgmAudio.src = 'El_Condor_Pasa_-_PsyOcean.mp3';
      bgmAudio.load();
      
      bgmAudio.play().then(() => {
        document.getElementById('musicBtn').textContent = '🔊 有声';
      }).catch(() => {});
    }

    function toggleMusic() {
      if (!bgmAudio) return;
      
      if (isMuted) {
        // 取消静音
        bgmAudio.volume = 0.5;
        isMuted = false;
        document.getElementById('musicBtn').textContent = '🔊 有声';
      } else {
        // 静音
        bgmAudio.volume = 0;
        isMuted = true;
        document.getElementById('musicBtn').textContent = '🔇 静音';
      }
    }

    // ========== 自动旋转 ==========
    let isAutoRotating = true;
    function toggleAutoRotate() {
      isAutoRotating = !isAutoRotating;
      if (controls) controls.autoRotate = isAutoRotating;
      document.getElementById('autoRotateBtn').classList.toggle('active', isAutoRotating);
    }

    // ========== 人物数据 ==========
    const characters = [
      { id:"jose_arcadio_buendia", name:"何塞·阿尔卡蒂奥·布恩迪亚", nameEn:"José Arcadio Buendía", gen:1, imp:5, color:"#ffd700", fate:"在栗树下被绑数十年，孤独死去", sym:"对知识的追求与孤独的宿命", rel:[{t:"ursula_iguaran",r:"妻子"},{t:"jose_arcadio",r:"儿子"},{t:"colonel_aureliano",r:"儿子"},{t:"amaranta",r:"女儿"},{t:"melquiades",r:"朋友"}], story:[{t:"杀死普鲁登西奥·阿基拉尔",d:"在一场斗鸡比赛中，普鲁登西奥当众羞辱何塞不是个真正的男人，说他和乌尔苏拉结婚这么久连个孩子都生不出来。但真相是：乌尔苏拉惧怕近亲结婚会生出怪物，一直拒绝与丈夫同房。这句嘲讽摧毁了何塞作为男人的尊严。他用家传的长矛刺穿了普鲁登西奥的喉咙。从那天起，鬼魂缠上了他。为了逃避，他带领族人离开了家乡。",o:"何塞用长矛刺穿了普鲁登西奥的喉咙，鲜血喷涌而出，溅了他一脸。从那天起，普鲁登西奥的鬼魂就缠上了他，每天晚上都会出现在他的床边，用那双死鱼般的眼睛盯着他。"},{t:"建立马孔多",d:"为了逃避鬼魂，何塞带领一群人翻山越岭，走了两年，在一片荒芜的土地上建立了马孔多。他相信世界不过是刚刚创世，许多东西还没有确切的名字，需要用手指着才能辨认。他用指南针规划街道，用热情凝聚人心。他是马孔多的创建者，也是这个家族的奠基人。",o:"世界太新，许多东西还没有名字，不得不用手指指点点。那时的马孔多是一个只有二十户人家的村庄，一座座土房都盖在河岸上，河水清澈，沿着遍布石头的河床流去。"},{t:"痴迷炼金术",d:"梅尔基亚德斯的到来点燃了何塞对未知世界的狂热。他用一头骡子和一群山羊换来了磁铁，用磁铁换了望远镜，用望远镜换了炼金术。他把家变成了炼金实验室，把家里的金器全部熔化，试图提炼出更纯的黄金。他在实验室里度过了无数个不眠之夜。乌尔苏拉说：你疯了。他说：我没有疯，我只是找到了通往真理的道路。",o:"何塞·阿尔卡蒂奥·布恩迪亚把炼金炉搬到了家里，他整天待在实验室里，用各种方法试图把金子从其他物质中分离出来。他变得消瘦、憔悴，但他的眼神却越来越明亮，仿佛看到了另一个世界的光芒。"},{t:"被绑在栗树下",d:"当疯狂吞噬了理智，他开始说拉丁语，说一些别人听不懂的话。他试图砍倒院子里的栗树。家人不得不用绳索将他绑在栗树下。风吹日晒，他在那里度过了余生，与孤独为伴，与树对话。他的头发长得像藤蔓一样垂到地上，他的身体被蚂蚁蛀空，但他的眼神依然明亮，仿佛看到了另一个世界的光芒。",o:"他们把他绑在栗树上，他以一种超乎寻常的尊严承受着这种处境，仿佛这是一件再自然不过的事情。他继续在那里生活了很久，嘴里念叨着谁也听不懂的话，直到有一天，人们发现他已经死在了树下。"}]},
      { id:"ursula_iguaran", name:"乌尔苏拉·伊瓜兰", nameEn:"Úrsula Iguarán", gen:1, imp:5, color:"#ffd700", fate:"一百多岁自然死亡，身体缩小成玩偶", sym:"生命力与家族的守护者", rel:[{t:"jose_arcadio_buendia",r:"丈夫"},{t:"jose_arcadio",r:"儿子"},{t:"colonel_aureliano",r:"儿子"},{t:"amaranta",r:"女儿"}], story:[{t:"近亲结婚的恐惧",d:"乌尔苏拉嫁给了自己的表兄，带着一个家族诅咒——近亲结婚会生出长猪尾巴的孩子。她拒绝与丈夫同房，因为害怕怀孕。这个恐惧成为她一生的阴影，也成为贯穿整个小说的预言。她的曾祖母就曾经因为近亲结婚生出了一个长着猪尾巴的孩子。",o:"乌尔苏拉·伊瓜兰在结婚前就知道她的丈夫是她的表兄。她一直害怕生出长猪尾巴的孩子。她的曾祖母就曾经因为近亲结婚生出了一个长着猪尾巴的孩子。那是这个家族永远的耻辱。"},{t:"糖果生意的崛起",d:"当丈夫沉迷于炼金术时，乌尔苏拉承担起了养家的重担。她开始制作小糖兽出售，生意越做越大，从一个小摊位发展成了一个小型工厂。她用赚来的钱扩建了房子，让家人过上了好日子。在男人们谈论革命、炼金术、哲学的时候，真正在养家糊口的，是这个女人。她一句话也没有多说，只是一天一天地做事。",o:"乌尔苏拉是这个家的主心骨，她用那双勤劳的手维持着这个摇摇欲坠的家。她忙碌了一辈子，从来没有一刻停歇。她的丈夫可以做梦，她的儿子可以去打仗，她的孙子可以沉溺于欲望，但她不行。她必须做饭、打扫、赚钱、养活这个正在膨胀的家族。"},{t:"缩小与死亡",d:"乌尔苏拉活了一百多岁。她看着丈夫发疯，看着儿子们走向战场，看着孙子们重复着父辈的错误，看着曾孙们在欲望中沉沦。她的身体开始缩小，像核桃一样收缩，被曾孙们当成玩具在屋子里推来推去。她死在一个复活节的早晨，没有人在她身边。",o:"乌尔苏拉变得越来越小。她的身体像一个核桃一样收缩，皮肤上布满了皱纹。她被孩子们放在篮子里，在屋子里推来推去。她在一个复活节的早晨死去。没有人发现她死了。"}]},
      { id:"colonel_aureliano", name:"奥雷里亚诺·布恩迪亚上校", nameEn:"Coronel Aureliano Buendía", gen:2, imp:5, color:"#ff4444", fate:"在栗树下孤独死去", sym:"战争的虚无与孤独的极致", rel:[{t:"jose_arcadio_buendia",r:"父亲"},{t:"ursula_iguaran",r:"母亲"},{t:"pilar_ternera",r:"情人"}], story:[{t:"发动三十二场战争",d:"他是马孔多最传奇的人物。他发动了三十二场武装起义——全部失败。他躲过十四次暗杀、七十三次埋伏和一次枪决。他与十七个女人生了十七个儿子，一夜之间被逐个除掉。他曾经是一个沉默寡言的金匠，战争改变了一切。他签署停战协议后拒绝了所有荣誉，只带了一箱金鱼回到马孔多。",o:"奥雷里亚诺·布恩迪亚上校发动了三十二场武装起义，三十二场全部失败。他躲过了十四次暗杀、七十三次埋伏和一次枪决。他与十七个女人生了十七个儿子，一夜之间被逐个除掉。"},{t:"制作小金鱼",d:"回到马孔多后，他把自己关在作坊里，反复制作小金鱼——做好了就熔化，熔化了再做。这种无尽的循环就是他余生的全部。他不再关心政治，不再关心战争，只关心那条永远做不完的小金鱼。这种循环——做、熔、做——和布恩迪亚家族的命运循环是一样的：生、死、生，重复相同的名字，犯相同的错误，走相同的绝路。",o:"他把小金鱼熔掉，重新开始，如此循环往复，以此来打发孤独的时光。他不再关心政治，不再关心战争，只关心那条永远做不完的小金鱼。"},{t:"孤独的死亡",d:"他死在栗树下——他父亲曾经被绑的那个位置。他是去小便的。他站着，回忆着什么，然后身体僵硬了，永远地闭上了眼睛。没有人发现他死了，直到乌尔苏拉路过，看到他站在那里，像一尊雕像。他的死亡是整部小说中最孤独的结局。",o:"奥雷里亚诺·布恩迪亚上校站在栗树下小便，他想起了父亲，想起了那些已经过去的岁月。他的身体突然僵硬了，他保持着那个姿势，永远地闭上了眼睛。"}]},
      { id:"jose_arcadio", name:"何塞·阿尔卡蒂奥", nameEn:"José Arcadio", gen:2, imp:4, color:"#ff4444", fate:"神秘死亡，坟墓散发火药味", sym:"原始欲望与被放逐的命运", rel:[{t:"jose_arcadio_buendia",r:"父亲"},{t:"ursula_iguaran",r:"母亲"},{t:"rebeca",r:"妻子"}], story:[{t:"跟随吉普赛人出走",d:"他继承的不是父亲的智慧，而是父亲的野性。他跟着一个吉普赛女人离开了马孔多，在海上漂泊多年，经历了无数冒险。当他再次出现在马孔多时，已经变成了一个满身纹身的巨人，眼中闪烁着野性的光芒。",o:"他跟着吉普赛人走了，就像他父亲当年痴迷于炼金术一样，他也痴迷于远方。多年后，当他再次出现在马孔多时，他已经变成了一个满身纹身的巨人，眼中闪烁着野性的光芒。"},{t:"神秘的死亡",d:"他的死是整部小说最大的谜团。子弹从左耳穿入，从右耳穿出。没有人知道谁杀了他，没有人知道他为什么被杀。但最诡异的是：他的血从门缝下流了出来，穿过客厅，沿着街道，一直流到了乌尔苏拉的脚下。为了绕过那些不该弄脏的地方，那血迹走了很多弯路。他的坟墓此后一直散发火药味，直到马孔多被飓风抹去。",o:"何塞·阿尔卡蒂奥的血从门缝下流出，穿过客厅，沿着街道，一直流到了乌尔苏拉的脚下。乌尔苏拉顺着血迹，走了无数个弯路，最终找到了儿子的尸体。"}]},
      { id:"amaranta", name:"阿玛兰妲", nameEn:"Amaranta", gen:2, imp:4, color:"#4488ff", fate:"终身未嫁，编织裹尸布死去", sym:"骄傲与爱情的永恒矛盾", rel:[{t:"jose_arcadio_buendia",r:"父亲"},{t:"ursula_iguaran",r:"母亲"}], story:[{t:"拒绝皮埃特罗",d:"她拒绝了所有求婚者，宁愿孤独也不愿妥协。",o:"阿玛兰妲拒绝了所有求婚者。"},{t:"编织裹尸布",d:"她白天编织，晚上拆掉，直到死亡降临。",o:"阿玛兰妲织了又拆，拆了又织，直到死亡降临。"}]},
      { id:"rebeca", name:"丽贝卡", nameEn:"Rebeca", gen:2, imp:3, color:"#4488ff", fate:"孤独老死", sym:"流浪者与被放逐的灵魂", rel:[{t:"jose_arcadio",r:"丈夫"}], story:[{t:"带着骨殖袋来到马孔多",d:"她带着父母的骨殖袋来到了马孔多，有吃土的怪癖。",o:"丽贝卡有吃土和石灰墙的习惯。"}]},
      { id:"pilar_ternera", name:"庇拉尔·特尔内拉", nameEn:"Pilar Ternera", gen:2, imp:4, color:"#ff69b4", fate:"一百多岁死去", sym:"欲望与命运的预言者", rel:[{t:"colonel_aureliano",r:"情人"},{t:"jose_arcadio",r:"情人"}], story:[{t:"纸牌占卜",d:"她用纸牌看透了这个家族的命运，却无法改变任何事情。",o:"庇拉尔用纸牌看透了布恩迪亚家族的命运。"}]},
      { id:"remedios_beauty", name:"美人儿蕾梅黛丝", nameEn:"Remedios, la Bella", gen:3, imp:4, color:"#ffd700", fate:"升天消失", sym:"纯真之美与世俗的格格不入", rel:[{t:"arcadio",r:"父亲"},{t:"santa_sofia",r:"母亲"}], story:[{t:"升天消失",d:"她抓着床单，缓缓升上天空，永远消失了。",o:"美人儿蕾梅黛丝抓着床单，缓缓升上天空，永远消失了。"}]},
      { id:"arcadio", name:"阿尔卡蒂奥", nameEn:"Arcadio", gen:3, imp:3, color:"#ff4444", fate:"被行刑队枪决", sym:"被遗弃的后代对权力的扭曲渴望", rel:[{t:"jose_arcadio",r:"父亲"},{t:"santa_sofia",r:"妻子"}], story:[{t:"马孔多的暴君",d:"他把马孔多变成了人间地狱。",o:"阿尔卡蒂奥成了马孔多有史以来最残暴的统治者。"}]},
      { id:"santa_sofia", name:"圣索菲亚·德拉·彼达", nameEn:"Santa Sofía de la Piedad", gen:3, imp:3, color:"#888888", fate:"悄然离开", sym:"无声的奉献与被遗忘的牺牲", rel:[{t:"arcadio",r:"丈夫"}], story:[{t:"默默支撑家族",d:"她从不抱怨，只是默默地操持家务。",o:"圣索菲亚在家族最艰难的时候，默默承担起了一切。"}]},
      { id:"aureliano_segundo", name:"奥雷里亚诺第二", nameEn:"Aureliano Segundo", gen:4, imp:4, color:"#ff4444", fate:"在病痛中死去", sym:"欲望的狂欢与生命的虚无", rel:[{t:"fernanda",r:"妻子"},{t:"petra_cotes",r:"情人"},{t:"meme",r:"女儿"}], story:[{t:"两个女人的丈夫",d:"他同时拥有两个家，仿佛有两个不同的灵魂。",o:"奥雷里亚诺第二同时拥有两个家。"}]},
      { id:"fernanda", name:"费尔南达·德尔·卡皮奥", nameEn:"Fernanda del Carpio", gen:4, imp:4, color:"#888888", fate:"孤独死去", sym:"旧秩序与新世界的冲突", rel:[{t:"aureliano_segundo",r:"丈夫"},{t:"meme",r:"女儿"}], story:[{t:"没落贵族的女儿",d:"她带着满身的规矩和偏见嫁进了马孔多。",o:"费尔南达来自一个没落的贵族家庭。"}]},
      { id:"petra_cotes", name:"佩特拉·科特斯", nameEn:"Petra Cotes", gen:4, imp:3, color:"#ff69b4", fate:"孤独老去", sym:"被世俗边缘化的真爱", rel:[{t:"aureliano_segundo",r:"情人"}], story:[{t:"牲畜的奇迹",d:"在她身边，牲畜疯狂繁殖。",o:"佩特拉·科特斯的存在让奥雷里亚诺第二的财富不断增加。"}]},
      { id:"meme", name:"梅梅（蕾纳塔·蕾梅黛丝·布恩迪亚）", nameEn:"Meme (Renata Remedios Buendía)", gen:4, imp:3, color:"#4488ff", fate:"在修道院度过余生", sym:"被家族扼杀的爱情与自由", rel:[{t:"aureliano_segundo",r:"父亲"},{t:"fernanda",r:"母亲"},{t:"mauricio_babilonia",r:"情人"}], story:[{t:"黄蝴蝶的爱情",d:"她爱上了莫里西奥·巴比洛尼亚。",o:"梅梅爱上了莫里西奥·巴比洛尼亚。"}]},
      { id:"mauricio_babilonia", name:"莫里西奥·巴比洛尼亚", nameEn:"Mauricio Babilonia", gen:4, imp:3, color:"#ffd700", fate:"被枪击瘫痪", sym:"浪漫爱情与世俗偏见的冲突", rel:[{t:"meme",r:"情人"}], story:[{t:"黄蝴蝶的传说",d:"他走到哪里，黄蝴蝶就跟到哪里。",o:"莫里西奥一出现，就有黄蝴蝶在他身边飞舞。"}]},
      { id:"jose_arcadio_rome", name:"何塞·阿尔卡蒂奥（次）", nameEn:"José Arcadio (Younger)", gen:5, imp:3, color:"#ff4444", fate:"被孩童溺死，财宝被夺", sym:"神职的伪装与被荒废的青春", rel:[{t:"aureliano_segundo",r:"父亲"},{t:"fernanda",r:"母亲"},{t:"amaranta_ursula",r:"妹妹"}], story:[{t:"被送往罗马神学院",d:"他被母亲费尔南达送去罗马学习神职，但并未成为神职人员。",o:"费尔南达把儿子送去罗马，希望他成为一名神父。"},{t:"返回马孔多挥霍宝藏",d:"母亲死后回到马孔多，找到乌尔苏拉埋藏的三袋金币，大肆挥霍。",o:"何塞·阿尔卡蒂奥找到了乌尔苏拉埋藏的金币，他不知道它们的价值，无度挥霍。"},{t:"被杀害",d:"四个孩童趁他洗澡时闯入，将他溺死在池中，抢走了剩余的金币。",o:"四名孩童趁他洗澡闯入房间，将他溺死在池中，抢走了金币。"}]},
      { id:"amaranta_ursula", name:"阿玛兰妲·乌尔苏拉", nameEn:"Amaranta Úrsula", gen:5, imp:4, color:"#ff69b4", fate:"产后大出血死亡", sym:"最后的希望与不可逃避的宿命", rel:[{t:"aureliano_last",r:"侄子/情人"},{t:"jose_arcadio_rome",r:"哥哥"}], story:[{t:"欧洲留学归来",d:"她是这个家族最后的希望。",o:"阿玛兰妲·乌尔苏拉回到马孔多，试图让这个家族重新焕发生机。"}]},
      { id:"aureliano_last", name:"奥雷里亚诺·巴比洛尼亚", nameEn:"Aureliano Babilonia", gen:6, imp:4, color:"#4488ff", fate:"与姑妈乱伦后生下猪尾巴婴儿", sym:"知识的终极与命运的闭环", rel:[{t:"amaranta_ursula",r:"姑妈/情人"}], story:[{t:"破译手稿",d:"他终于破译了梅尔基亚德斯的手稿。",o:"他终于破译了梅尔基亚德斯的手稿。"}]},
      { id:"last_buendia", name:"最后一个布恩迪亚", nameEn:"The Last Buendía", gen:7, imp:5, color:"#888888", fate:"出生即被蚂蚁吃掉", sym:"百年孤独的最终审判", rel:[{t:"aureliano_last",r:"父亲"},{t:"amaranta_ursula",r:"母亲"}], story:[{t:"被蚂蚁吃掉",d:"他一出生就长着猪尾巴，被蚂蚁吃掉。",o:"这个家族的第一个人被绑在树上，最后一个人正被蚂蚁吃掉。"}]},
      { id:"melquiades", name:"梅尔基亚德斯", nameEn:"Melquíades", gen:0, imp:5, color:"#ffd700", fate:"死而复生，留下预言手稿", sym:"命运的书写者与时间的超越者", rel:[{t:"jose_arcadio_buendia",r:"朋友"}], story:[{t:"留下预言手稿",d:"他用梵文写下了这个家族的命运。",o:"梅尔基亚德斯用梵文写下了这个家族的命运。"}]},
      { id:"prudencio_aguilar", name:"普鲁登西奥·阿基拉尔", nameEn:"Prudencio Aguilar", gen:1, imp:2, color:"#888888", fate:"被杀后化为鬼魂", sym:"罪孽与诅咒", rel:[], story:[{t:"斗鸡场上的羞辱",d:"斗鸡场上，何塞·阿尔卡蒂奥·布恩迪亚的公鸡击败了普鲁登西奥的公鸡。普鲁登西奥不服，当众羞辱何塞——他嘲笑何塞不是个真正的男人，说他和乌尔苏拉结婚这么久连个孩子都生不出来。但真相是：乌尔苏拉惧怕近亲结婚会生出长猪尾巴的孩子，一直拒绝与丈夫同房。这句嘲讽精准地刺中了何塞最深的痛处——他的新婚妻子拒绝与他同床，整个村子都在背后议论他。他不是不行，而是不被允许。这句嘲讽摧毁了他作为一个男人的尊严。",o:"乌尔苏拉·伊瓜兰在结婚前就知道她的丈夫是她的表兄。她一直害怕生出长猪尾巴的孩子。她的曾祖母就曾经因为近亲结婚生出了一个长着猪尾巴的孩子。那是这个家族永远的耻辱，直到那个孩子被砍掉尾巴，活了四十二岁。乌尔苏拉决定，在她确认不会怀孕之前，绝不与丈夫同房。"},{t:"被杀",d:"何塞愤怒地拿起了家传的长矛，刺穿了普鲁登西奥的喉咙。鲜血喷涌而出，溅了他一脸。从这一刻起，一切都改变了。何塞杀了人，他必须逃离。这个逃离导致了马孔多的建立，导致了整个布恩迪亚家族的历史。一部百年史诗，由一个无名小卒的死亡开启。",o:"何塞·阿尔卡蒂奥·布恩迪亚用长矛刺穿了普鲁登西奥·阿基拉尔的喉咙。鲜血喷涌而出，溅了他一脸。从那天起，普鲁登西奥的鬼魂就缠上了他，每天晚上都会出现在他的床边，用那双死鱼般的眼睛盯着他。"},{t:"鬼魂的纠缠",d:"普鲁登西奥的鬼魂每天晚上出现在何塞的床边，用那双死鱼般的眼睛盯着他。不是愤怒，不是悲伤，不是哀求——他只是看着。这种无法被回应的注视，比任何诅咒都更可怕。何塞试图用长矛刺他，但长矛穿过了鬼魂的身体，什么也没有刺到。这双眼睛是整个小说最恐怖的意象之一。它代表了命运本身——命运不做任何事，它只是看着你，看着你一步步走向它的安排。",o:"普鲁登西奥的鬼魂每天晚上都会出现在何塞的床边。他用那双死鱼般的眼睛盯着他，什么也不说。有时候他只是站在那里，有时候他会叹息。乌尔苏拉也看到了他。何塞拿起长矛刺向他，但长矛穿过了他的身体，什么也没有刺到。"}]},
      { id:"general_moncada", name:"何塞·拉凯尔·蒙卡达将军", nameEn:"General José Raquel Moncada", gen:2, imp:3, color:"#ff4444", fate:"被上校亲手处决", sym:"理性与秩序", rel:[{t:"colonel_aureliano",r:"挚友/敌人"}], story:[{t:"被处决",d:"他是奥雷里亚诺上校最好的朋友，也是他亲手处决的第一个人。他与上校从小在马孔多一起长大。",o:"蒙卡达是奥雷里亚诺上校最好的朋友，也是他亲手处决的第一个人。"}]},

      { id:"gerineldo_marquez", name:"赫里内尔多·马尔克斯上校", nameEn:"Colonel Gerineldo Márquez", gen:2, imp:3, color:"#4488ff", fate:"孤独终老", sym:"战争留下的空洞", rel:[{t:"colonel_aureliano",r:"挚友/战友"},{t:"amaranta",r:"追求者"}], story:[{t:"追随上校",d:"他是奥雷里亚诺上校最忠诚的战友，从小一起长大，一起经历了三十二场战争。",o:"赫里内尔多·马尔克斯是奥雷里亚诺上校最好的朋友和最忠诚的战友。"},{t:"爱上阿玛兰妲",d:"他深爱阿玛兰妲多年，多次向她求婚，但都被拒绝。",o:"赫里内尔多·马尔克斯一次次向阿玛兰妲求婚，但她一次次地拒绝了他。他最终孤独终老。"},{t:"孤独的晚年",d:"战争结束后，他回到马孔多在作坊里制作小金鱼，最终在孤独中死去。",o:"赫里内尔多·马尔克斯在那间小作坊里日复一日地做着小金鱼，直到生命尽头。"}]},
      { id:"father_nicanor", name:"尼卡诺尔·雷纳神父", nameEn:"Father Nicanor Reyna", gen:2, imp:2, color:"#ffd700", fate:"离开马孔多", sym:"信仰在荒芜中的无力", rel:[], story:[{t:"搭建教堂",d:"他是第一个来到马孔多的神父，试图在这个没有信仰的小镇建立教堂。",o:"尼卡诺尔·雷纳神父来到马孔多，说这里的人的灵魂需要拯救。"},{t:"喝巧克力升天",d:"为了证明上帝的存在，他喝了一杯巧克力后在弥撒中升离地面。",o:"尼卡诺尔·雷纳神父喝了一杯热巧克力后，在弥撒中悬浮了起来——他以此证明上帝的存在。"}]},

      { id:"gabriel_marquez", name:"加夫列尔·加西亚·马尔克斯", nameEn:"Gabriel García Márquez", gen:6, imp:2, color:"#888888", fate:"离开马孔多去巴黎", sym:"作家作为角色的元叙事", rel:[{t:"aureliano_last",r:"朋友"}], story:[{t:"与奥雷里亚诺的友谊",d:"他是奥雷里亚诺·巴比洛尼亚的朋友，也是梅尔基亚德斯手稿的读者之一。他就是作者本人。",o:"加夫列尔——那个后来写了百年孤独的人——在小说中也是一个角色。他坐在梅尔基亚德斯的房间里，和奥雷里亚诺一起讨论手稿。"},{t:"去巴黎",d:"他离开马孔多去了巴黎，卖掉了自己的旧书换了钱。",o:"加夫列尔卖掉了他所有的旧书，凑够了去巴黎的路费。他在巴黎的阁楼上写下了这个故事。"}]},
      { id:"jose_arcadio_segundo", name:"何塞·阿尔卡蒂奥第二", nameEn:"José Arcadio Segundo", gen:4, imp:3, color:"#4488ff", fate:"见证大屠杀", sym:"真相与遗忘", rel:[{t:"aureliano_segundo",r:"双胞胎兄弟"}], story:[{t:"见证大屠杀",d:"他是香蕉工人大屠杀的见证者，但没有人相信他。",o:"何塞·阿尔卡蒂奥第二是香蕉工人大屠杀的见证者。"}]}
    ];

    const terms = [
      { id:"alchemy", name:"炼金术", cat:"技艺", sym:"对知识的追求与对现实的逃避", d:"何塞把家变成了炼金实验室，试图从空气中提炼黄金。", o:"何塞把炼金炉搬到了家里，整天待在实验室里。" },
      { id:"little_goldfish", name:"小金鱼", cat:"物品", sym:"无尽的循环与孤独的逃避", d:"上校反复制作小金鱼，做好了就融化，融化了再做。", o:"他把小金鱼熔掉，重新开始，如此循环往复。" },
      { id:"chestnut_tree", name:"栗树", cat:"植物", sym:"牢笼与孤独", d:"何塞被绑在栗树下度过了余生。", o:"他们把他绑在栗树上。" },
      { id:"yellow_butterflies", name:"黄蝴蝶", cat:"意象", sym:"浪漫爱情与神秘力量", d:"莫里西奥走到哪里，黄蝴蝶就跟到哪里。", o:"莫里西奥一出现，就有黄蝴蝶在他身边飞舞。" },
      { id:"macondo", name:"马孔多", cat:"地点", sym:"文明与荒芜", d:"何塞建立的村庄，整个故事的舞台。", o:"世界太新，许多东西还没有名字。" },
      { id:"manuscripts", name:"梅尔基亚德斯的手稿", cat:"物品", sym:"命运与预言", d:"用梵文写下的家族全部历史。", o:"他终于破译了梅尔基亚德斯的手稿。" }
    ];

    // ========== 3D 场景 ==========
    let scene, camera, renderer, controls;
    let planets = [];
    let connections = [];
    let raycaster, mouse;
    let selectedPlanet = null;
    let currentGen = 0;
    let meteors = [];
    let celestialObjects = []; // 星云与星座对象

    function createCircleTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.2, 'rgba(255,255,255,0.8)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.3)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }


    function createCelestialObjects() {
      const events = [
        { id:'founding', name:'马孔多的建立', color:0x44aaff },
        { id:'insomnia', name:'失眠症', color:0xaa44ff },
        { id:'massacre', name:'香蕉工人大屠杀', color:0xff4444 },
        { id:'hurricane', name:'飓风毁灭', color:0x44ffaa },
      ];
      
      const terms = [
        { id:'alchemy', name:'炼金术', color:0xffd700 },
        { id:'goldfish', name:'小金鱼', color:0xff8800 },
        { id:'symbols', name:'核心意象', color:0xff69b4 },
      ];
      
      const tex = createCircleTexture();
      
      // 星云：每个事件用三层粒子堆叠，高透明度+脉冲
      events.forEach((ev, idx) => {
        const angle = Math.PI * 0.3 * idx + 0.5;
        const dist = 350 + idx * 60;
        const cx = Math.cos(angle) * dist;
        const cz = Math.sin(angle) * dist;
        const cy = -50 + idx * 35;
        
        // 核心层（密集）
        const count = 300;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          pos[i*3] = (Math.random() - 0.5) * 35;
          pos[i*3+1] = (Math.random() - 0.5) * 25;
          pos[i*3+2] = (Math.random() - 0.5) * 35;
        }
        const g1 = new THREE.BufferGeometry();
        g1.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const m1 = new THREE.PointsMaterial({
          color: ev.color, size: 4, transparent: true, opacity: 0.9,
          map: tex, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const p1 = new THREE.Points(g1, m1);
        p1.position.set(cx, cy, cz);
        p1.userData = { type: 'celestial', kind: 'event', id: ev.id, name: ev.name, main: true };
        scene.add(p1);
        
        // 外层光晕（大颗粒）
        const gcount = 150;
        const gpos = new Float32Array(gcount * 3);
        for (let i = 0; i < gcount; i++) {
          gpos[i*3] = (Math.random() - 0.5) * 80;
          gpos[i*3+1] = (Math.random() - 0.5) * 60;
          gpos[i*3+2] = (Math.random() - 0.5) * 80;
        }
        const g2 = new THREE.BufferGeometry();
        g2.setAttribute('position', new THREE.BufferAttribute(gpos, 3));
        const m2 = new THREE.PointsMaterial({
          color: ev.color, size: 8, transparent: true, opacity: 0.3,
          map: tex, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const p2 = new THREE.Points(g2, m2);
        p2.position.copy(p1.position);
        scene.add(p2);
        
        // 最外层超大颗粒（云絮效果）
        const g3count = 60;
        const g3pos = new Float32Array(g3count * 3);
        for (let i = 0; i < g3count; i++) {
          g3pos[i*3] = (Math.random() - 0.5) * 130;
          g3pos[i*3+1] = (Math.random() - 0.5) * 100;
          g3pos[i*3+2] = (Math.random() - 0.5) * 130;
        }
        const g3 = new THREE.BufferGeometry();
        g3.setAttribute('position', new THREE.BufferAttribute(g3pos, 3));
        const m3 = new THREE.PointsMaterial({
          color: ev.color, size: 14, transparent: true, opacity: 0.12,
          map: tex, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const p3 = new THREE.Points(g3, m3);
        p3.position.copy(p1.position);
        scene.add(p3);
        
        // 发光中心（亮球）
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(5, 12, 12),
          new THREE.MeshBasicMaterial({ color: ev.color, transparent: true, opacity: 1 })
        );
        core.position.copy(p1.position);
        core.userData = { type: 'celestial', kind: 'event', id: ev.id, name: ev.name, main: true };
        scene.add(core);
        
        // 隐形碰撞体（扩大点击范围）
        const hitBox = new THREE.Mesh(
          new THREE.SphereGeometry(20, 8, 8),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        hitBox.position.copy(p1.position);
        hitBox.userData = { type: 'celestial', kind: 'event', id: ev.id, name: ev.name, main: true, hitBox: true };
        scene.add(hitBox);
        
        celestialObjects.push({
          mesh: p1, glow: [p2, p3, core], id: ev.id,
          name: ev.name, type: 'event',
          basePos: { x: cx, y: cy, z: cz }, core: core, hitBox: hitBox
        });
      });
      
      // 星座：增加轮廓线和更多节点
      terms.forEach((tm, idx) => {
        const angle = Math.PI * 0.3 * idx + 2.0;
        const dist = 350 + idx * 60;
        const cx = Math.cos(angle) * dist;
        const cz = Math.sin(angle) * dist;
        const cy = 10 + idx * 35;
        
        let shapePoints = [];
        const s = 28;
        
        if (tm.id === 'goldfish') {
          // 小金鱼：完整的鱼形轮廓
          // 鱼身（椭圆）
          for (let i = 0; i <= 20; i++) {
            const a = (i / 20) * Math.PI * 2;
            shapePoints.push([Math.cos(a) * s * 0.6, Math.sin(a) * s * 0.35, 0]);
          }
          // 鱼尾
          shapePoints.push([-s * 0.6, 0, 0]);
          shapePoints.push([-s * 0.9, s * 0.35, 0]);
          shapePoints.push([-s * 0.6, 0, 0]);
          shapePoints.push([-s * 0.9, -s * 0.35, 0]);
          shapePoints.push([-s * 0.6, 0, 0]);
          // 鱼眼
          shapePoints.push([s * 0.25, s * 0.1, 0]);
        } else if (tm.id === 'alchemy') {
          // 炼金术：圆形+十字+三角
          for (let i = 0; i <= 24; i++) {
            const a = (i / 24) * Math.PI * 2;
            shapePoints.push([Math.cos(a) * s, Math.sin(a) * s, 0]);
          }
          // 内三角
          for (let i = 0; i <= 3; i++) {
            const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
            shapePoints.push([Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5, 0]);
          }
          // 中心点
          shapePoints.push([0, 0, 0]);
        } else if (tm.id === 'symbols') {
          // 四瓣花 → 蝴蝶/黄蝴蝶形状
          for (let i = 0; i <= 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            shapePoints.push([
              Math.cos(a) * s * (0.6 + 0.4 * Math.abs(Math.cos(a * 2))),
              Math.sin(a) * s * 0.5,
              0
            ]);
          }
          // 身体中线
          shapePoints.push([0, -s * 0.3, 0]);
          shapePoints.push([0, s * 0.3, 0]);
        }
        
        // 外轮廓线（较亮）
        const pts = shapePoints.map(p => new THREE.Vector3(p[0], p[1], p[2]));
        const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
        const lineMat = new THREE.LineBasicMaterial({
          color: tm.color, transparent: true, opacity: 0.8
        });
        const line = new THREE.Line(lineGeom, lineMat);
        line.position.set(cx, cy, cz);
        line.userData = { type: 'celestial', kind: 'term', id: tm.id, name: tm.name };
        scene.add(line);
        
        // 节点星（发光点）
        const nodePos = new Float32Array(shapePoints.length * 3);
        shapePoints.forEach((p, i) => {
          nodePos[i*3] = p[0]; nodePos[i*3+1] = p[1]; nodePos[i*3+2] = p[2];
        });
        const nGeom = new THREE.BufferGeometry();
        nGeom.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
        const nMat = new THREE.PointsMaterial({
          color: tm.color, size: 6, transparent: true,
          opacity: 0.9, map: tex, blending: THREE.AdditiveBlending
        });
        const nodes = new THREE.Points(nGeom, nMat);
        nodes.position.set(cx, cy, cz);
        nodes.userData = { type: 'celestial', kind: 'term', id: tm.id, name: tm.name };
        scene.add(nodes);
        
        // 发光中心球
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(2.5, 10, 10),
          new THREE.MeshBasicMaterial({ color: tm.color, transparent: true, opacity: 0.8 })
        );
        core.position.set(cx, cy, cz);
        core.userData = { type: 'celestial', kind: 'term', id: tm.id, name: tm.name };
        scene.add(core);
        
        // 隐形碰撞体（扩大点击范围）
        const hitBox = new THREE.Mesh(
          new THREE.SphereGeometry(20, 8, 8),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        hitBox.position.set(cx, cy, cz);
        hitBox.userData = { type: 'celestial', kind: 'term', id: tm.id, name: tm.name, hitBox: true };
        scene.add(hitBox);
        
        celestialObjects.push({
          mesh: nodes, glow: [line, core], id: tm.id,
          name: tm.name, type: 'term',
          basePos: { x: cx, y: cy, z: cz }, core: core, hitBox: hitBox
        });
      });
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000308);
      scene.fog = new THREE.FogExp2(0x000308, 0.0002);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 15000);
      camera.position.set(0, 120, 350);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.03;
      controls.maxDistance = 1200;
      controls.minDistance = 80;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;

      // 光照
      scene.add(new THREE.AmbientLight(0x101025, 0.6));
      
      const sunLight = new THREE.PointLight(0xffeedd, 2, 2000);
      sunLight.position.set(0, 0, 0);
      scene.add(sunLight);
      
      const blueLight = new THREE.PointLight(0x4488ff, 0.8, 1500);
      blueLight.position.set(-300, 150, 300);
      scene.add(blueLight);
      
      const pinkLight = new THREE.PointLight(0xff69b4, 0.4, 1000);
      pinkLight.position.set(300, -150, -300);
      scene.add(pinkLight);

      createStarfield();
      createNebula();
      createOrbitRings();
      createPlanets();
      createConnections();
      createMeteors();
      createCelestialObjects();

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      renderer.domElement.addEventListener('mousemove', onMouseMove);
      renderer.domElement.addEventListener('click', onClick);
      renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
      renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('resize', onResize);

      renderGenSelector();
      animate();
    }

    function createMeteors() {
      // 初始化流星数组
      meteors = [];
    }

    function spawnMeteor() {
      if (meteors.length >= 5) return;
      
      const tex = createCircleTexture();
      
      // 随机方向和位置
      const angle = Math.random() * Math.PI * 2;
      const pitch = (Math.random() - 0.5) * Math.PI;
      const dist = 800 + Math.random() * 400;
      
      const startPos = new THREE.Vector3(
        Math.cos(angle) * Math.cos(pitch) * dist,
        Math.sin(pitch) * dist,
        Math.sin(angle) * Math.cos(pitch) * dist
      );
      
      // 随机方向（朝屏幕中心偏移）
      const direction = new THREE.Vector3(
        -startPos.x + (Math.random() - 0.5) * 400,
        -startPos.y + (Math.random() - 0.5) * 300,
        -startPos.z + (Math.random() - 0.5) * 400
      ).normalize();
      
      // 流星头部光点
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(2, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      head.position.copy(startPos);
      scene.add(head);
      
      // 流星尾巴 - 多个点形成拖尾
      const trailPoints = [];
      for (let i = 0; i < 20; i++) {
        trailPoints.push(startPos.clone());
      }
      const trailGeo = new THREE.BufferGeometry().setFromPoints(trailPoints);
      const trailMat = new THREE.LineBasicMaterial({ 
        color: 0xaaccff, transparent: true, opacity: 0.8, 
        linewidth: 1 
      });
      const trail = new THREE.Line(trailGeo, trailMat);
      scene.add(trail);
      
      meteors.push({
        head, trail, direction, speed: 8 + Math.random() * 12,
        life: 0, maxLife: 2 + Math.random() * 3
      });
    }

    function createStarfield() {
      const tex = createCircleTexture();
      
      // 远景密集星星
      const g1 = new THREE.BufferGeometry();
      const v1 = [], c1 = [];
      for (let i = 0; i < 25000; i++) {
        v1.push((Math.random()-0.5)*10000, (Math.random()-0.5)*10000, (Math.random()-0.5)*10000);
        const r = Math.random();
        if (r<0.5) c1.push(0.9,0.9,1); else if (r<0.7) c1.push(0.6,0.7,1); else if (r<0.85) c1.push(1,0.9,0.6); else c1.push(1,0.7,0.5);
      }
      g1.setAttribute('position', new THREE.Float32BufferAttribute(v1, 3));
      g1.setAttribute('color', new THREE.Float32BufferAttribute(c1, 3));
      scene.add(new THREE.Points(g1, new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.85, map: tex, alphaTest: 0.1 })));

      // 中等距离星星
      const g2 = new THREE.BufferGeometry();
      const v2 = [], c2 = [];
      for (let i = 0; i < 5000; i++) {
        v2.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        const r = Math.random();
        if (r<0.5) c2.push(1,1,1); else if (r<0.7) c2.push(0.8,0.9,1); else c2.push(1,0.9,0.7);
      }
      g2.setAttribute('position', new THREE.Float32BufferAttribute(v2, 3));
      g2.setAttribute('color', new THREE.Float32BufferAttribute(c2, 3));
      scene.add(new THREE.Points(g2, new THREE.PointsMaterial({ size: 2.5, vertexColors: true, transparent: true, opacity: 1, map: tex, alphaTest: 0.1 })));

      // 简洁优雅的恒星
      const starDefs = [
        { color: 0xffeedd, glow: 0xffaa44, size: 25 },
        { color: 0xff8844, glow: 0xff6622, size: 35 },
        { color: 0xaaccff, glow: 0x6699ff, size: 18 },
        { color: 0xffcc88, glow: 0xff9933, size: 28 },
        { color: 0xffffff, glow: 0xaabbff, size: 15 },
        { color: 0xff6644, glow: 0xff4422, size: 40 },
      ];
      
      for (let i = 0; i < 15; i++) {
        const d = starDefs[i % starDefs.length];
        const pos = new THREE.Vector3(
          (Math.random()-0.5)*4000, 
          (Math.random()-0.5)*4000, 
          (Math.random()-0.5)*4000
        );
        
        // 核心
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(d.size, 32, 32), 
          new THREE.MeshBasicMaterial({ color: d.color })
        );
        core.position.copy(pos);
        scene.add(core);
        
        // 内层光晕
        const innerGlow = new THREE.Mesh(
          new THREE.SphereGeometry(d.size * 1.5, 32, 32),
          new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.5, side: THREE.BackSide })
        );
        innerGlow.position.copy(pos);
        scene.add(innerGlow);
        
        // 中层光晕
        const midGlow = new THREE.Mesh(
          new THREE.SphereGeometry(d.size * 2.5, 32, 32),
          new THREE.MeshBasicMaterial({ color: d.glow, transparent: true, opacity: 0.2, side: THREE.BackSide })
        );
        midGlow.position.copy(pos);
        scene.add(midGlow);
        
        // 外层光晕
        const outerGlow = new THREE.Mesh(
          new THREE.SphereGeometry(d.size * 4, 32, 32),
          new THREE.MeshBasicMaterial({ color: d.glow, transparent: true, opacity: 0.08, side: THREE.BackSide })
        );
        outerGlow.position.copy(pos);
        scene.add(outerGlow);
        
        // 弥散光晕
        const diffuseGlow = new THREE.Mesh(
          new THREE.SphereGeometry(d.size * 8, 32, 32),
          new THREE.MeshBasicMaterial({ color: d.glow, transparent: true, opacity: 0.03, side: THREE.BackSide })
        );
        diffuseGlow.position.copy(pos);
        scene.add(diffuseGlow);
      }
    }

    function createNebula() {
      const tex = createCircleTexture();
      [
        { n: 800, c1: 0x220044, c2: 0x002244, c3: 0x330022, cx: 500, cy: 250, cz: -400 },
        { n: 600, c1: 0x440000, c2: 0x442200, c3: 0x220000, cx: -600, cy: 150, cz: 300 },
        { n: 500, c1: 0x002244, c2: 0x004422, c3: 0x003344, cx: 400, cy: -300, cz: 600 },
        { n: 400, c1: 0x330033, c2: 0x003333, c3: 0x330022, cx: -300, cy: -200, cz: -500 },
      ].forEach(cfg => {
        const g = new THREE.BufferGeometry();
        const v = [], c = [];
        for (let i = 0; i < cfg.n; i++) {
          const r = Math.random() * 350;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          v.push(cfg.cx + r*Math.sin(phi)*Math.cos(theta), cfg.cy + r*Math.cos(phi)*0.4, cfg.cz + r*Math.sin(phi)*Math.sin(theta));
          const c1 = new THREE.Color(cfg.c1), c2 = new THREE.Color(cfg.c2), c3 = new THREE.Color(cfg.c3);
          const t = Math.random();
          const fc = t < 0.4 ? c1.lerp(c2, Math.random()) : t < 0.7 ? c2.lerp(c3, Math.random()) : c1.lerp(c3, Math.random());
          c.push(fc.r, fc.g, fc.b);
        }
        g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 30, vertexColors: true, transparent: true, opacity: 0.1, map: tex, alphaTest: 0.01, blending: THREE.AdditiveBlending, depthWrite: false })));
      });
    }

    function createOrbitRings() {
      [60, 120, 180, 240, 300, 360, 420].forEach(r => {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(r - 0.3, r + 0.3, 128),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
        );
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);
      });
    }

    function createPlanets() {
      const tex = createCircleTexture();
      const genGroups = {};
      characters.forEach(ch => { if (!genGroups[ch.gen]) genGroups[ch.gen] = []; genGroups[ch.gen].push(ch); });

      let y = -120;
      [0,1,2,3,4,5,6,7].forEach(gen => {
        const group = genGroups[gen];
        if (!group) return;
        const r = 25 + group.length * 8;
        const step = group.length > 1 ? (Math.PI * 2) / group.length : 0;

        group.forEach((ch, i) => {
          const a = step * i;
          const x = group.length > 1 ? Math.cos(a) * r : 0;
          const z = group.length > 1 ? Math.sin(a) * r : 0;
          const size = 2 + ch.imp * 1.2;

          const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(size, 32, 32),
            new THREE.MeshPhongMaterial({ color: new THREE.Color(ch.color), emissive: new THREE.Color(ch.color), emissiveIntensity: 0.3, transparent: true, opacity: 0.9 })
          );
          mesh.position.set(x, y, z);
          mesh.userData = { character: ch };
          scene.add(mesh);

          const glow = new THREE.Mesh(
            new THREE.SphereGeometry(size * 2, 32, 32),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(ch.color), transparent: true, opacity: 0.06, side: THREE.BackSide })
          );
          glow.position.copy(mesh.position);
          scene.add(glow);

          const pg = new THREE.BufferGeometry();
          const pv = [];
          for (let j = 0; j < 40; j++) {
            const pa = Math.random() * Math.PI * 2;
            const pr = size * 2 + Math.random() * size;
            pv.push(mesh.position.x + Math.cos(pa)*pr, mesh.position.y + (Math.random()-0.5)*size, mesh.position.z + Math.sin(pa)*pr);
          }
          pg.setAttribute('position', new THREE.Float32BufferAttribute(pv, 3));
          const pp = new THREE.Points(pg, new THREE.PointsMaterial({ color: new THREE.Color(ch.color), size: 0.8, transparent: true, opacity: 0.3, map: tex, alphaTest: 0.1 }));
          scene.add(pp);

          planets.push({ mesh, glow, particles: pp, character: ch, baseY: y });
          
          // 创建名称标签
          const label = document.createElement('div');
          label.className = 'planet-label';
          label.innerHTML = ch.name + '<span class="label-gen">第' + ch.gen + '代</span>';
          label.dataset.charId = ch.id;
          document.getElementById('planetLabels').appendChild(label);
          
          // 存储标签引用到planet对象
          planets[planets.length - 1].label = label;
        });
        y += 55;
      });
    }

    function createConnections() {
      const pm = {};
      planets.forEach(p => { pm[p.character.id] = p; });
      characters.forEach(ch => {
        if (!ch.rel) return;
        ch.rel.forEach(r => {
          const from = pm[ch.id], to = pm[r.t];
          if (from && to) {
            const line = new THREE.Line(
              new THREE.BufferGeometry().setFromPoints([from.mesh.position.clone(), to.mesh.position.clone()]),
              new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 })
            );
            line.userData = { from: ch.id, to: r.t };
            scene.add(line);
            connections.push(line);
          }
        });
      });
    }

    function renderGenSelector() {
      const s = document.getElementById('genSelector');
      let h = '<div class="gen-btn active" onclick="filterGen(0)">全部</div>';
      for (let i = 1; i <= 7; i++) h += `<div class="gen-btn" onclick="filterGen(${i})">第${i}代</div>`;
      s.innerHTML = h;
    }

    function filterGen(gen) {
      currentGen = currentGen === gen ? 0 : gen;
      document.querySelectorAll('.gen-btn').forEach((el, i) => {
        el.className = 'gen-btn' + ((i === 0 && currentGen === 0) || (i === gen) ? ' active' : '');
      });
      planets.forEach(p => {
        const ok = p.character.gen === currentGen;
        p.mesh.material.opacity = currentGen === 0 ? 0.9 : (ok ? 1 : 0.08);
        p.glow.material.opacity = currentGen === 0 ? 0.06 : (ok ? 0.15 : 0.01);
        p.particles.material.opacity = currentGen === 0 ? 0.3 : (ok ? 0.5 : 0.03);
      });
    }

    function toScreenPos(obj) {
      const vec = new THREE.Vector3();
      obj.getWorldPosition(vec);
      vec.project(camera);
      return {
        x: (vec.x * 0.5 + 0.5) * window.innerWidth,
        y: (-vec.y * 0.5 + 0.5) * window.innerHeight
      };
    }

    function onMouseMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hitMeshes = planets.map(p => p.mesh); celestialObjects.forEach(co => { hitMeshes.push(co.mesh); if (co.glow) co.glow.forEach(g => hitMeshes.push(g)); if (co.core) hitMeshes.push(co.core); if (co.hitBox) hitMeshes.push(co.hitBox); }); const hits = raycaster.intersectObjects(hitMeshes);
      const tip = document.getElementById('tooltip');
      
      // 重置所有星球亮度
      planets.forEach(p => {
        p.mesh.material.emissiveIntensity = 0.3;
        p.glow.material.opacity = 0.06;
        if (p.label) p.label.classList.remove('show');
      });
      
      if (hits.length > 0) {
        const hitData = hits[0].object.userData;
        if (hitData.type === 'celestial') {
          celestialObjects.forEach(co => {
            const isHit = co.mesh === hits[0].object || (co.glow && co.glow.includes(hits[0].object)) || co.core === hits[0].object || co.hitBox === hits[0].object;
            co.mesh.material.opacity = isHit ? 1 : 0.7;
            if (co.glow) co.glow.forEach(g => { if (g.material) g.material.opacity = isHit ? 1 : 0.4; });
            if (co.core) co.core.material.opacity = isHit ? 1 : 0.6;
          });
          tip.style.display = 'block';
          tip.style.left = e.clientX + 15 + 'px';
          tip.style.top = e.clientY + 15 + 'px';
          document.getElementById('tooltipName').textContent = hitData.name || '';
          document.getElementById('tooltipGen').textContent = (hitData.kind === 'event' ? '◆ 事件星云' : '✦ 名物星座');
          renderer.domElement.style.cursor = 'pointer';
        } else {
          celestialObjects.forEach(co => { co.mesh.material.opacity = 0.7; if (co.glow) co.glow.forEach(g => { if (g.material) g.material.opacity = 0.4; }); if (co.core) co.core.material.opacity = 0.6; });
        }
        const ch = hits[0].object.userData.character;
        // 高亮悬停星球
        const planet = planets.find(p => p.character.id === ch.id);
        if (planet) {
          planet.mesh.material.emissiveIntensity = 0.9;
          planet.glow.material.opacity = 0.35;
          if (planet.label) {
            const pos = toScreenPos(planet.mesh);
            planet.label.style.left = pos.x + 'px';
            planet.label.style.top = (pos.y - 15) + 'px';
            planet.label.classList.add('show');
          }
          // 关联关系星球微亮
          ch.rel.forEach(r => {
            const relPlanet = planets.find(p => p.character.id === r.t);
            if (relPlanet) {
              relPlanet.mesh.material.emissiveIntensity = 0.5;
              relPlanet.glow.material.opacity = 0.12;
            }
          });
        }
        tip.style.display = 'block';
        tip.style.left = e.clientX + 15 + 'px';
        tip.style.top = e.clientY + 15 + 'px';
        document.getElementById('tooltipName').textContent = ch.name;
        document.getElementById('tooltipGen').textContent = `第${ch.gen}代 · ${ch.sym}`;
        renderer.domElement.style.cursor = 'pointer';
      } else {
        tip.style.display = 'none';
        renderer.domElement.style.cursor = 'grab';
      }
    }

    function onTouchStart(e) {
      e.preventDefault();
      const t = e.touches[0];
      mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;
      // 模拟点击
      raycaster.setFromCamera(mouse, camera);
      const hitMeshes = planets.map(p => p.mesh);
      celestialObjects.forEach(co => { hitMeshes.push(co.mesh); if (co.glow) co.glow.forEach(g => hitMeshes.push(g)); if (co.core) hitMeshes.push(co.core); if (co.hitBox) hitMeshes.push(co.hitBox); });
      const hits = raycaster.intersectObjects(hitMeshes);
      if (hits.length > 0) {
        const obj = hits[0].object;
        const data = obj.userData;
        if (data.type === 'celestial') { openEncyclopediaDetail(data.kind, data.id); return; }
        if (data.character) { openPanel(data.character); }
      }
    }
    
    function onTouchMove(e) {
      e.preventDefault();
      const t = e.touches[0];
      mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;
      // 模拟悬停检测（简化版）
      raycaster.setFromCamera(mouse, camera);
      const hitMeshes = planets.map(p => p.mesh);
      celestialObjects.forEach(co => { hitMeshes.push(co.mesh); if (co.glow) co.glow.forEach(g => hitMeshes.push(g)); if (co.core) hitMeshes.push(co.core); if (co.hitBox) hitMeshes.push(co.hitBox); });
      const hits = raycaster.intersectObjects(hitMeshes);
      planets.forEach(p => { p.mesh.material.emissiveIntensity = 0.3; p.glow.material.opacity = 0.06; if (p.label) p.label.classList.remove('show'); });
      if (hits.length > 0) {
        const hitData = hits[0].object.userData;
        if (hitData.type === 'celestial') {
          celestialObjects.forEach(co => { const isHit = co.mesh === hits[0].object || (co.glow && co.glow.includes(hits[0].object)) || co.core === hits[0].object || co.hitBox === hits[0].object; co.mesh.material.opacity = isHit ? 1 : 0.7; if (co.glow) co.glow.forEach(g => { if (g.material) g.material.opacity = isHit ? 1 : 0.4; }); if (co.core) co.core.material.opacity = isHit ? 1 : 0.6; });

        <div class="story-original">"普鲁登西奥的鬼魂每天晚上都会出现在何塞的床边。他用那双死鱼般的眼睛盯着他，什么也不说。有时候他只是站在那里，有时候他会叹息。乌尔苏拉也看到了他。有一次他在院子里洗脸，乌尔苏拉看到了他，吓得尖叫起来。何塞拿起长矛刺向他，但长矛穿过了他的身体，什么也没有刺到。"</div>

        <p>普鲁登西奥的死，是整部小说结构上的基石。他的死亡导致了一个直接后果：何塞必须离开。何塞的离开导致了马孔多的建立。马孔多的建立导致了整个布恩迪亚家族的历史。一部百年史诗，由一个无名小卒的死亡开启。</p>
        <p>这就是马尔克斯式的叙事逻辑：大历史起源于最微小的偶然。一个男人在斗鸡场上说了不该说的话，结果一个家族延续了一百年，然后又毁灭了。听起来很荒谬，但这也许就是历史的真相——多少伟大的王朝，不也是起源于一个微不足道的偶然？</p>

        <p>这双"死鱼般的眼睛"，是整个小说最恐怖的意象之一。它不愤怒，不悲伤，不哀求——它只是看着你，看着你，看着你。这种无法被回应的注视，比任何诅咒都更可怕。</p>

          代际: 第一代 | 身份: 马孔多建立者 · 家族的始祖 · 理想主义者 · 最后的疯子<br>

        <p>何塞·阿尔卡蒂奥·布恩迪亚是一个生错了时代的人。他拥有文艺复兴式的广阔好奇心，却困在一个连冰块都没有见过的小村庄里。他是堂吉诃德和浮士德的混合体——既有堂吉诃德的理想主义与疯狂，又有浮士德的对知识的永不满足。</p>

        <div class="story-header" style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:20px;border:none">▸ 第一阶段 · 英雄时代</div>
        <p>在故事开始之前，他是一个年轻的领袖。他带领族人和家人翻过山岭，走过沼泽，在一片荒芜的土地上建立了马孔多。他用指南针规划街道，用热情凝聚人心。他是一切的创造者，这个村庄是他梦想的产物。</p>
        <p>在那个时刻，他相信世界是可以被理解的。他说："世界太新，许多东西还没有名字，不得不用手指指点点。"这句话是整个小说的钥匙——它不仅描述了早期的马孔多，也描述了人类的幼年时期：一切都是新的，一切都有待命名。</p>
        <p>但他第一个命名的东西，不是河流、不是山川、不是街道——而是一具尸体。</p>

        <p>他用逃亡来回应这个罪孽。但没有人能逃过自己的影子。</p>

        <div class="story-header" style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:20px;border:none">▸ 第二阶段 · 探索者的疯狂</div>
        <p>吉普赛人的到来，改变了一切。</p>
        <p>梅尔基亚德斯带来了磁铁。何塞用一头骡子和一群山羊换来了这块磁铁，因为他相信可以用它来吸出黄金。他整天拖着磁铁在屋子里走，把铁钉、铁锅、铁盆吸得满天飞。乌尔苏拉在后面追着他喊"你疯了"，他头也不回。</p>
        <p>他又换来了望远镜。他整天用望远镜观察天空。他相信透过这个管子能看到宇宙的规律。他站在院子里，对着夜空看了很久，然后得出了一个结论——地球是圆的。</p>
        <p>乌尔苏拉说："你发疯了。"<br>何塞回答："我没有发疯，我只是找到了通往真理的道路。"</p>
        <p>然后换来了冰块。这是他一生中最震撼的时刻。他花了钱，把手放在冰块上，然后震惊地说："它在烧。"他的这种矛盾修辞，是对"魔幻现实主义"最精准的自我描述——在魔幻的层面上，冰确实会"燃烧"（它比你预想的要烫手）；在现实的层面上，它只是一个朴素的比喻错误。</p>
        <p>他最后换来了炼金术。他把家里的金器全部熔化。他的炼金炉把房间弄得乌烟瘴气。他变得越来越瘦，眼睛却越来越亮。</p>
        <p>这是全书中一个极其悲壮的画面：一个男人，在自己的院子里，拖着一块磁铁，相信它能创造财富。他不是愚蠢。他是太聪明了——聪明到无法被这个平庸的世界容纳。</p>

        <div class="story-header" style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:20px;border:none">▸ 第三阶段 · 被绑在栗树下</div>
        <p>最终，他真的疯了。</p>
        <p>他开始说拉丁语，说一些别人听不懂的话。他试图拆掉房子，要按照梅尔基亚德斯的图纸重新建造。他对着空气说话，好像那里站着什么人。</p>
        <p>家人无奈地把他绑在了院子里的栗树上。</p>
        <p>他被绑在树上的那些年，头发和指甲疯狂地生长。他的皮肤被日晒雨淋，变得像树皮一样粗糙。乌尔苏拉每天给他送饭，给他洗澡。他像一株植物一样活着。</p>
        <p>有时候他会抬起头，用那双依然明亮的眼睛看着过路的人，说一些谁也听不懂的话。然后他又低下头，看着自己脚下的泥土。他就这样活了一年又一年。</p>
        <p>在一个下雨的早晨，人们发现他低着头，死在了栗树下。</p>
        <p>他的死亡是整部小说第一代命运的终点——一个曾经试图理解宇宙的人，最终被一棵树囚禁了一生。</p>

        <div style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━ 原文段落 ━</div>

        <div class="original-section" style="margin-top:10px"><span class="original-label">磁铁的场景</span></div>
        <div class="story-original">"吉普赛人又来了。这次他们带来了一块磁铁。那是一块巨大的磁铁，是何塞·阿尔卡蒂奥·布恩迪亚用一头骡子和一群山羊换来的。他的妻子乌尔苏拉本来想用这些牲畜来扩大家业的，却没能阻止他。<br><br>'很快我们就会有金子了，'他对朋友说。'只需要三个月。'<br><br>他拖着那块磁铁，走遍了整个地区，从马孔多一直走到远处的山脚下。他走遍了每一寸土地，每一个角落，他的热忱使吉普赛人自己也感到惊讶。他什么也没有找到。只有一件锈蚀的铠甲，敲起来发出空洞的回声，里面有一块石头般的钙化物，何塞·阿尔卡蒂奥·布恩迪亚认定那是黄金容器，但吉普赛人告诉他那只是某种动物的骨头。"</div>

        <div class="original-section" style="margin-top:10px"><span class="original-label">冰块的场景</span></div>

        <div class="story-original">"何塞·阿尔卡蒂奥·布恩迪亚开始胡言乱语，说拉丁语，说一些别人听不懂的话。他试图拆掉房子上的砖瓦，说要按照梅尔基亚德斯的图纸重新安排它们。乌尔苏拉叫人用棕榈叶和绳子把他绑在栗树上。<br><br>他被绑在栗树上的那些年里，一直在说拉丁语，说一些别人听不懂的话。他的身体被日晒雨淋，变得粗糙。乌尔苏拉每天给他送饭，给他洗澡。他继续活着，以一种植物般的方式活着。<br><br>当人们经过他身边时，他有时会抬起头，用那双明亮的眼睛看着他们，说一些谁也听不懂的话。然后他又低下头，继续看着脚下的泥土。<br><br>他就这样度过了一年又一年，直到一个下雨的早晨，人们发现他低着头，死在了栗树下。"</div>

        <div style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━ 深度分析 ━</div>
        <p>何塞·阿尔卡蒂奥·布恩迪亚是一个悲剧性的启蒙者，他的悲剧在于他生在了一个无法理解他的时代。</p>
        <p>"磁铁"和"冰块"是他一生中最重要的两个隐喻。磁铁代表了他对世界底层规律的着迷——是什么力量让某些东西吸在一起？为什么有些物体之间存在着看不见的引力？冰块代表了他对物质本质的好奇——水是如何变成冰的？这背后有什么原理？</p>
        <p>他想知道的是宇宙的真相。</p>
        <p>但他唯一的工具是吉普赛人带来的新奇玩意。他只有磁铁，却想弄懂万有引力；他只有望远镜，却想弄懂宇宙的几何结构；他只有炼金炉，却想弄懂生命的秘密。</p>
        <p>这是一种悲壮的错位——他不是不够聪明，而是时代给他的工具太少了。</p>
        <p>他的疯狂，不是一种病理症状，而是一种"被时代抛弃"的本能反应。当一个聪明人活在一个不理解他的时代里，他只有三条路：沉默、逃离、或者发疯。何塞选择了第三条。</p>
        <p>他被绑在栗树上的场景，是整个小说的第一个"被绑"的意象。在结尾，最后一个布恩迪亚被蚂蚁吃掉。这两个意象形成了一种残酷的对称——第一个人被一棵树囚禁，最后一个人被一群蚂蚁吞噬。中间的所有人，都在被某种东西束缚着。被名字束缚。被命运束缚。被孤独束缚。</p>
        <p>何塞·阿尔卡蒂奥·布恩迪亚的死亡，标志着这个家族探索精神的终结。在他之后，这个家族再也没有人试图去理解这个世界了——他们只追逐欲望、权力、爱情。一个没有探索者的家族，注定走向衰落。</p>

        <p>她的恐惧最终在第七代身上变成了现实。在她死后多年，那个长着猪尾巴的婴儿出生了，被蚂蚁吃掉了。如果她还活着，她一定会说：我早就告诉过你们。</p>

        <p>这是一个极具象征意义的行动：一个母亲去找她的孩子，没有找到，却找到了改变整个社区命运的道路。</p>

        <div class="story-header" style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:20px;border:none">▸ 三、糖果帝国的崛起</div>

        <p>她代表了马孔多最底层的声音——那些没有说出口的声音。她们在故事中没有名字，在历史中没有位置。但她们存在过。</p>

        <div style="margin-bottom:10px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 事件脉络 ━</div>
        <div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:10px;font-size:13px;line-height:2">
          <div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:4px 8px"><span style="color:#888;width:100px;display:inline-block">相识</span>成为奥雷里亚诺·巴比洛尼亚的情人</div>
          <div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:4px 8px"><span style="color:#888;width:100px;display:inline-block">关系</span>纯粹的肉体关系，不涉情感承诺</div>
          <div style="padding:4px 8px"><span style="color:#888;width:100px;display:inline-block">结束</span>奥雷里亚诺爱上姑妈后，不再来找她</div>
        </div>

        <div style="margin-bottom:10px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 象征意义 ━</div>
        <p><strong>无名的存在</strong>。她是马孔多无数无名的女人的代表——她们的身体被使用，但没有人在乎她们的名字。她们是历史的背景板。</p>
        <p><strong>沉默的清醒</strong>。她不要求任何东西，因为她知道——在马孔多，要求也没有用。她的沉默不是软弱，是看透了。</p>

        <div style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 原文段落 ━</div>
        <div class="story-original">"尼格罗曼塔不问他从哪里来，不问他到哪里去。她什么都不问。当奥雷里亚诺躺在她的床上看着裂了缝的天花板时，她躺在他身边，也没有说话。她在想什么？没有人知道。也许她在想：这个男孩不会在我这里待太久。"</div>

        <div style="margin-bottom:10px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 同类对比 ━</div>
        <div style="background:rgba(255,255,255,0.03);border-radius:8px;overflow:hidden;font-size:13px">
          <div style="display:flex;padding:8px 10px;background:rgba(255,255,255,0.03);font-weight:600;border-bottom:1px solid rgba(255,255,255,0.08)"><span style="flex:1">角色</span><span style="flex:1">相似点</span><span style="flex:1">不同点</span></div>

          <div style="padding:8px 10px"><span style="flex:1">佩特拉·科特斯</span><span style="flex:1">同样作为情人不求名分</span><span style="flex:1">佩特拉的爱带来了财富和生命力，尼格罗曼塔的爱什么都没有带来</span></div>

      fullBio['gabriel_marquez'] = {
        title: '加夫列尔·加西亚·马尔克斯',
        subtitle: '作者本人 · 小说中的角色',
        content: `<div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;padding:10px;border:1px solid rgba(255,255,255,0.05);border-radius:8px;background:rgba(255,255,255,0.01)">
          出场章节: 第十一章 | 身份: 奥雷里亚诺·巴比洛尼亚的朋友 | 代际: 第六代
        </div>
        <p>在《百年孤独》中，加夫列尔·加西亚·马尔克斯——这本书的作者——也作为一个角色出现了。这是文学史上最精妙的元叙事手法之一：一个作家把自己写进了自己的书里，让读者在最后一页才恍然大悟。</p>
        <p>他是奥雷里亚诺·巴比洛尼亚的朋友。他们一起在梅尔基亚德斯的房间里研究那些无法破译的梵文手稿。他是一个瘦削的、安静的年轻人。他话不多。但他总能在那些看不懂的文字中看到某种意义——一种连奥雷里亚诺都看不到的意义。</p>
        <p>他说："这些手稿写的是我们的命运。" 奥雷里亚诺说："你看不懂梵文。" 他说："我不需要看懂。我能感觉到。"</p>
        <p>他是马孔多唯一一个相信手稿终将被破译的人。也是唯一一个在全部人还在困惑时就已经隐约看到了结局的人。</p>
        <p>他后来离开了马孔多。他卖掉了自己所有的旧书——哲学书、诗集、小说——凑够了去巴黎的路费。他走的那天，奥雷里亚诺没有送他。他站在梅尔基亚德斯的房间门口，看着这个朋友的身影消失在马孔多灰蒙蒙的街道尽头。</p>
        <p>他去了巴黎。住在一间没有暖气的阁楼上。窗外是灰蒙蒙的欧洲天空。他坐在桌前，用一支旧钢笔开始写。他写了一个被飓风抹去的小镇，写了一个百年孤独的家族，写了一个破译手稿的人。</p>
        <p>他写的和梅尔基亚德斯写的是同一个故事。</p>
        <p>在小说的最后一行，当飓风毁灭马孔多的时候，手稿中写着一句预言："注定要一百年处于孤独的世族不会有在大地上第二次机会。" 而写下这句预言的人——梅尔基亚德斯——和写下整本书的人——加夫列尔·加西亚·马尔克斯——在此刻合为了一体。作者、读者、预言者、角色，在最后一行文字中相视而笑。</p>

        <div style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 深度分析 ━</div>
        <p>加夫列尔·加西亚·马尔克斯把自己写进自己的小说里——这是文学史上最大胆的元叙事手法之一。他不是一个躲在文字后面的隐形的神，他走进了自己的故事，坐在了角色中间。他在梅尔基亚德斯的房间里和奥雷里亚诺一起读那些看不懂的手稿——就像我们读者一样。</p>
        <p>这是一个精妙的循环：梅尔基亚德斯写下了布恩迪亚家族的历史，加西亚·马尔克斯写下了《百年孤独》，而我们读到了这一切。在最后一页，作者和预言者的边界消失了。</p>
        <p>这不是一个简单的"作者出场彩蛋"。这是对整个叙事行为本身的反思。谁在写故事？是梅尔基亚德斯、是加西亚·马尔克斯、还是命运本身？小说没有回答这个问题。它只是让飓风把一切抹去。</p>

        <div style="margin-bottom:5px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 原文段落 ━</div>
        <div class="story-original">"加夫列尔是那个卖掉了所有旧书去巴黎的人。他在梅尔基亚德斯的房间里和奥雷里亚诺一起研究那些梵文手稿。他看不懂一个字。但他比任何人都确定这些手稿是有意义的。有些人不需要看懂就能理解——而这恰恰是作家的本能。"</div>

        <div style="margin-bottom:10px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 事件脉络 ━</div>
        <div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:10px;font-size:13px;line-height:2">
          <div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:4px 8px"><span style="color:#888;width:100px;display:inline-block">在马孔多</span>与奥雷里亚诺·巴比洛尼亚一起研究手稿</div>
          <div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:4px 8px"><span style="color:#888;width:100px;display:inline-block">离开</span>卖掉旧书凑路费，前往巴黎</div>
          <div style="padding:4px 8px"><span style="color:#888;width:100px;display:inline-block">写作</span>在巴黎的阁楼上写下这个百年孤独的故事</div>
        </div>

        <div style="margin-bottom:10px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 象征意义 ━</div>
        <p><strong>作家的命运</strong>。他是唯一一个离开马孔多并活下来的人。因为他不是布恩迪亚家族的人。他是一个见证者——站在故事之外，所以能看见故事的全貌。</p>
        <p><strong>元叙事</strong>。他出现在自己的小说中，打破了读者和故事之间的墙。这提醒我们：我们读到的不是真实，是文字。</p>

        <div style="margin-bottom:10px;font-size:14px;color:#ffd700;font-weight:600;margin-top:25px">━━ 同类对比 ━</div>

          <div style="display:flex;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="flex:1">梅尔基亚德斯</span><span style="flex:1">同样写下/预言了这个故事</span><span style="flex:1">梅尔基亚德斯是小说中的预言者，加西亚·马尔克斯是小说外的作者——两人在最后一页合二为一</span></div>
          <div style="padding:8px 10px"><span style="flex:1">普鲁登西奥·阿基拉尔</span><span style="flex:1">同样开启了什么又结束着什么</span><span style="flex:1">普鲁登西奥的死开启故事，加西亚·马尔克斯写下终结</span></div>
        </div>`
      };

    function toggleStory(el) { const c = el.nextElementSibling, t = el.querySelector('.story-toggle'); c.classList.toggle('show'); t.textContent = c.classList.contains('show') ? '收起' : '展开'; }

    function closePanel() {
      document.getElementById('panel').classList.remove('show');
      selectedPlanet = null;
      planets.forEach(p => { p.mesh.material.emissiveIntensity = 0.3; p.glow.material.opacity = 0.06; });

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const t = Date.now() * 0.001;
      
      // 星云星座缓慢漂移+脉冲
      const ct = Date.now() * 0.0003;
      celestialObjects.forEach((co, ci) => {
        const p = co.basePos;
        const drift = Math.sin(ct + ci) * 4;
        const pulse = 0.8 + Math.sin(ct * 2 + ci * 1.5) * 0.2;
        if (co.mesh) {
          co.mesh.position.y = p.y + drift;
          co.mesh.material.opacity = pulse;
        }
        if (co.glow) {
          co.glow.forEach(g => {
            g.position.y = p.y + drift;
            if (g.material) {
              if (g.material.opacity !== undefined && g !== co.core) {
                g.material.opacity = Math.min(1, (g === co.glow[0]) ? pulse * 0.4 : pulse * 0.15);
              }
            }
          });
        }
        if (co.core) {
          co.core.position.y = p.y + drift;
          const corePulse = 0.8 + Math.sin(ct * 1.5 + ci) * 0.2;
          co.core.material.opacity = corePulse;
          co.core.scale.setScalar(0.8 + Math.sin(ct * 2 + ci) * 0.3);
        }
      });
      
      // 星球动画
      planets.forEach(p => {
        p.mesh.position.y = p.baseY + Math.sin(t * 0.3 + p.mesh.position.x * 0.03) * 3;
        p.glow.position.copy(p.mesh.position);
        p.particles.rotation.y += 0.002;
        p.particles.position.copy(p.mesh.position);
      });
      
      // 更新标签位置（仅对可见标签）
      planets.forEach(p => {
        if (p.label && p.label.classList.contains('show')) {
          const pos = toScreenPos(p.mesh);
          p.label.style.left = pos.x + 'px';
          p.label.style.top = (pos.y - 15) + 'px';
        }
      });
      
      // 流星动画
      if (Math.random() < 0.008) spawnMeteor(); // 随机产生
      
      meteors = meteors.filter(m => {
        m.life += 1/60;
        if (m.life >= m.maxLife) {
          scene.remove(m.head);
          scene.remove(m.trail);
          m.head.geometry.dispose();
          m.head.material.dispose();
          m.trail.geometry.dispose();
          m.trail.material.dispose();
          return false;
        }
        
        // 移动流星
        const moveVec = m.direction.clone().multiplyScalar(m.speed);
        m.head.position.add(moveVec);
        
        // 更新拖尾
        const positions = m.trail.geometry.attributes.position.array;
        for (let i = positions.length - 1; i >= 3; i--) {
          positions[i] = positions[i - 3];
        }
        positions[0] = m.head.position.x;
        positions[1] = m.head.position.y;
        positions[2] = m.head.position.z;
        m.trail.geometry.attributes.position.needsUpdate = true;
        
        // 淡出
        const alpha = 1 - (m.life / m.maxLife);
        m.trail.material.opacity = alpha * 0.8;
        m.head.material.opacity = alpha;
        
        return true;
      });
      
      renderer.render(scene, camera);
    }

          <p>猪尾巴是命运的终极回应：你越害怕什么，就越会得到什么。不是因为它注定要发生，而是因为你的一生都在为它做准备。乌尔苏拉用一百年的恐惧，亲手召唤了她最害怕的东西。</p>`
        }
      };
      
      const key = cat + '_' + id;
      const data = content[key];
      
      if (!data) {
        list.innerHTML = '<div style="padding:20px;color:rgba(255,255,255,0.5)">内容加载中，待继续补充...</div>';
        return;
      }
      
      list.innerHTML = `
        <div class="close-btn" onclick="showEncyList('${cat}')" style="position:static;display:inline-flex;margin-bottom:15px;width:auto;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)">← 返回列表</div>
        <div style="padding:15px 0">
          <div style="font-size:22px;font-weight:700;margin-bottom:4px">${data.title}</div>
          <div style="font-size:12px;color:rgba(255,215,0,0.6);margin-bottom:20px">${data.subtitle}</div>
          ${data.body}
        </div>
      `;
